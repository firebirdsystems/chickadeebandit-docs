<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Documents</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
      --shadow-md:    0 4px 12px rgba(0,0,0,.1);
      --red: var(--hub-tint-danger-fg, #dc2626); --red-light: var(--hub-tint-danger, #fee2e2);
      --amber: #d97706; --amber-light: #fef3c7;
      --green: #059669;
    }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--bg); color: var(--text);
      min-height: 100vh; font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }

    .layout { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--card); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header {
      padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-header h2 { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .folder-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    .folder-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; cursor: pointer; font-size: 0.875rem;
      transition: background .12s; user-select: none;
    }
    .folder-item:hover { background: var(--bg); }
    .folder-item.active { background: var(--bg); font-weight: 600; color: var(--accent); }
    .folder-icon { font-size: 1rem; flex-shrink: 0; }
    .folder-name { flex: 1; truncate: true; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder-lock { font-size: 0.7rem; color: var(--amber); flex-shrink: 0; }
    .folder-count { font-size: 0.7rem; color: var(--muted); flex-shrink: 0; }

    /* ── Main area ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .main-header {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .main-header h1 { font-size: 1.1rem; font-weight: 700; flex: 1; }
    .files-grid {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px;
      align-content: start;
    }

    /* ── File card ── */
    .file-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
      cursor: pointer; transition: box-shadow .15s, border-color .15s;
      position: relative;
    }
    .file-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-mid); }
    .file-thumb {
      height: 100px; border-radius: 4px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); font-size: 2.5rem;
    }
    .file-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .file-name { font-size: 0.78rem; font-weight: 600; line-height: 1.3; word-break: break-word; }
    .file-meta { font-size: 0.7rem; color: var(--muted); }
    .file-del {
      position: absolute; top: 6px; right: 6px; opacity: 0;
      background: var(--red); color: #fff; border: none; border-radius: 4px;
      padding: 2px 6px; font-size: 0.7rem; cursor: pointer; transition: opacity .15s;
    }
    .file-rename {
      position: absolute; top: 6px; left: 6px; opacity: 0;
      background: var(--accent-light); color: var(--accent); border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 6px; font-size: 0.7rem; cursor: pointer; transition: opacity .15s;
    }
    .file-move {
      position: absolute; bottom: 6px; right: 6px; opacity: 0;
      background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 6px; font-size: 0.7rem; cursor: pointer; transition: opacity .15s;
    }
    .file-card:hover .file-del, .file-card:hover .file-rename, .file-card:hover .file-move { opacity: 1; }
    /* Nothing hovers on a touch screen, so the controls would stay invisible
       (and still tappable) there. */
    @media (hover: none) {
      .file-del, .file-rename, .file-move { opacity: 1; }
    }

    /* ── Upload zone ── */
    .drop-zone {
      border: 2px dashed var(--border-mid); border-radius: var(--radius);
      padding: 32px; text-align: center; cursor: pointer;
      transition: border-color .15s, background .15s;
      color: var(--muted); font-size: 0.875rem;
      grid-column: 1 / -1;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent); background: var(--bg);
    }
    .drop-zone .drop-icon { font-size: 2rem; margin-bottom: 8px; }

    /* ── Progress ── */
    .upload-progress {
      grid-column: 1 / -1; background: var(--card);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 16px;
    }
    .progress-bar-wrap { height: 6px; background: var(--bg); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width .1s; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 8px; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; border: none; transition: opacity .15s, background .15s;
    }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--hub-primary-fg, #fff); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border-mid); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
    .btn-icon { padding: 6px; background: transparent; border: none; cursor: pointer; color: var(--muted); font-size: 1rem; }
    .btn-icon:hover { color: var(--text); }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .modal {
      background: var(--card); border-radius: var(--radius);
      width: 100%; max-width: 480px; padding: 24px; max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 8px 12px; font-size: 0.9rem; outline: none; font-family: inherit;
      transition: border-color .15s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions .btn { flex: 1; justify-content: center; }

    /* ── Preview modal ── */
    .preview-modal {
      max-width: 90vw; max-height: 90vh; width: 860px;
      display: flex; flex-direction: column; padding: 0; overflow: hidden;
    }
    .preview-header {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .preview-header h3 { flex: 1; font-size: 0.95rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-body { flex: 1; overflow: auto; min-height: 300px; background: #1e293b; display: flex; align-items: center; justify-content: center; }
    .preview-body img { max-width: 100%; max-height: 70vh; object-fit: contain; }
    .preview-body embed { width: 100%; height: 70vh; border: none; }
    .preview-body .no-preview { color: #94a3b8; font-size: 0.9rem; text-align: center; padding: 40px; }

    /* ── Empty ── */
    .empty { grid-column: 1 / -1; text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }

    /* ── Error ── */
    .error-msg { background: var(--red-light); color: var(--red); border-radius: 8px; padding: 9px 13px; font-size: 0.85rem; }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .files-grid .load-error { grid-column: 1 / -1; }

    /* ── Storage bar ── */
    .storage-bar { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 0.72rem; color: var(--muted); }
    .storage-track { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .storage-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width .3s; }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .sidebar { width: 56px; }
      .folder-name, .folder-lock, .folder-count, .sidebar-header h2 { display: none; }
      .sidebar-header { justify-content: center; }
      .folder-item { justify-content: center; padding: 10px 8px; }
      .files-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }
  </style>
<base href="/run/docs/">
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Folders</h2>
      <button class="btn-icon" id="new-folder-btn" title="New folder" aria-label="New folder" onclick="openNewFolder()"></button>
    </div>
    <div class="folder-list" id="folder-list">
      <div style="padding:16px;color:var(--muted);font-size:.8rem">Loading…</div>
    </div>
    <div class="storage-bar" id="storage-bar" style="display:none">
      <span id="storage-text"></span>
      <div class="storage-track"><div class="storage-fill" id="storage-fill" style="width:0%"></div></div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="main-header">
      <h1 id="folder-title">Select a folder</h1>
      <div id="header-actions" style="display:flex;gap:8px"></div>
    </div>
    <div class="files-grid" id="files-grid">
      <div class="empty">
        <div class="empty-icon"></div>
        <p>Select a folder to view documents</p>
      </div>
    </div>
  </main>
</div>

<!-- Hidden file input -->
<input type="file" id="file-input" style="display:none" />

<script type="module">
import { hubAlert, memberColor, initial, esc, isAdult, formatRelativeDate, hubConfirm, searchMatch, glyph, chickadee } from "/hub-sdk.js";
import { createFilesHelper } from "/hub-sdk.js";
import { ALLOWED_EXTENSIONS, isImage, isPreviewableImage, isPdf, fileGlyph, formatBytes, accept, folderPathSafe, MAX_FOLDER_NAME_LENGTH, searchableFields,
  DOCS_PAGE_LIMIT, fetchAllDocs, parseFoldersMeta, folderEntry, buildFolderList,
  OPEN_FOLDERS_KEY, PRIVATE_FOLDERS_KEY, mergeFolderStores, planFolderWrites, planFolderMigration, visibilityKind, visibleFolders, folderNameTaken, resolveVisibility, canChangeDoc, folderListHtml, outcomeUnknown, sameFile, docForFile,
  failureLine, uploadFailureLine } from "./logic.js";

// Static markup cannot call the SDK, so these marks are drawn here.
document.getElementById("new-folder-btn").innerHTML = glyph("plus");
document.querySelector("#files-grid .empty-icon").innerHTML = chickadee("nest", { size: 72 });

// ── Globals ────────────────────────────────────────────────────────────────────
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
const IS_ADULT   = isAdult(HUB_MEMBER);
const IS_ADMIN   = window.__IS_ADMIN === true;
const IS_ROSTER  = window.__SPACE_KIND === "roster";
// Who may create folders, upload, rename, or delete. In a roster (classroom /
// team / clients) only the steward — the space admin/teacher — writes; everyone
// else is read-only. Elsewhere any adult may. The hub enforces this server-side
// (document_acls / file_acls / store_acls: require_role "adult" and
// roster_steward_only); this flag only keeps everyone else from being shown
// controls that would 403.
const CAN_WRITE  = IS_ROSTER ? IS_ADMIN : IS_ADULT;
// A document is changed only by its owner or an admin — the hub refuses anyone
// else, so they are not offered the rename, move and delete controls.
const mayChange = (doc) => canChangeDoc(doc, { canWrite: CAN_WRITE, isAdmin: IS_ADMIN, memberId: HUB_MEMBER?.id });

const DOCS    = window.__DOCS_URL    ?? "";
const STORE   = window.__STORE_URL   ?? "";
const CONTEXT = window.__CONTEXT_URL ?? "";
const files = createFilesHelper(window.__FILES_URL ?? "");

// ── State ──────────────────────────────────────────────────────────────────────
let folders        = [];   // [{ name, visibility, doc_count }]
let currentFolder  = null; // { name, visibility }
let currentFiles   = [];
let storageInfo    = { totalBytes: 0, limit: 0 };
let uploading      = false;
let hubGroups      = [];   // HubMemberGroup[]
let docSearch      = "";
let filesLoading   = false; // the open folder's documents are still being read
let filesError     = null;  // why they could not be read, when they could not
let filesLoadSeq   = 0;     // newest loadFiles call; older answers are dropped

// ── Docs API helpers ───────────────────────────────────────────────────────────
// What a failed request is reported as. A failed write gets the line
// `failureLine` picks from its status ("try again" only where trying again can
// work); a failed read gets `line`. Only wording this app wrote for the reader
// (marked `forUser` where it is thrown) is shown as is: what the hub said goes
// to the console and never to the page.
function failText(e, line) { if (!e?.forUser) console.error(e); return e?.forUser ? e.message : line; }
/** hubAlert's second argument: the reason, when there is one meant for the reader. */
function reasonFor(e) { return e?.forUser ? { description: e.message } : (console.error(e), undefined); }
/** A failed write's line, as hubAlert's second argument. */
function failureFor(e, words) { if (!e?.forUser) console.error(e); return { description: failureLine(e, words) }; }
// The hub's refusal as an Error carrying its `status` and `code`; its text is
// the Error's message, for the console only.
async function hubError(res, fallback) {
  const err = await res.json().catch(() => ({}));
  console.error(fallback, res.status, err?.error);
  return Object.assign(new Error(typeof err?.error === "string" ? err.error : fallback), { status: res.status, code: err?.code });
}
// Every document matching `params`, read to the end of the list. Throws when a
// page cannot be read: callers rename, re-share and delete on what this
// returns, and "the read failed" must never look like "the folder is empty".
function docsGetAll(params = {}) {
  return fetchAllDocs(async (cursor) => {
    const qs = new URLSearchParams({ ...params, limit: String(DOCS_PAGE_LIMIT) });
    if (cursor) qs.set("cursor", cursor);
    const res = await fetch(`${DOCS}?${qs}`);
    if (!res.ok) throw await hubError(res, "Couldn’t load the documents.");
    const more = res.headers.get("X-Documents-Has-More") === "true";
    return { docs: await res.json(), nextCursor: more ? res.headers.get("X-Documents-Next-Cursor") : null };
  });
}
async function docsCreate(body) {
  const res = await fetch(DOCS, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  // The status says whether the document may have been stored all the same.
  if (!res.ok) throw await hubError(res, "Couldn’t save the document.");
  return res.json();
}
// Delete and patch answer { ok, error } and never throw, so a batch can count
// its failures and a single action can say why it was refused. `words` name
// the action for `failureLine`.
async function docsWrite(id, init, words) {
  try {
    const res = await fetch(`${DOCS}/${encodeURIComponent(id)}`, init);
    if (res.ok) return { ok: true };
    return {
      ok: false,
      // Turned away (403, 404, 409, 413, 415, 507): pressing again will not
      // change that, so a batch that met one does not ask for a retry.
      refused: !outcomeUnknown({ status: res.status }) && res.status !== 429,
      error: res.status === 403
        ? "Only the person who added a document, or an admin, can change it."
        : failureLine(await hubError(res, "Document request failed"), words),
    };
  } catch (e) {
    console.error(e);
    return { ok: false, error: failureLine(e, words) };
  }
}
function docsDelete(id) {
  return docsWrite(id, { method: "DELETE" }, { action: "delete the document", thing: "document" });
}
function docsPatch(id, patch, words = { action: "update the document", thing: "document" }) {
  return docsWrite(id, {
    method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch),
  }, words);
}

// Folder metadata is kept in app KV as { [name]: { visibility, createdBy } },
// under two keys (see OPEN_FOLDERS_KEY in logic.js): folders shared with
// everyone in one anyone may read, every other folder in one the hub serves to
// adults only.
//
// Both reads throw when they fail. Folder edits fall back to writing a whole
// map for legacy names, and uploads take a folder's visibility from these — an
// unread map taken for an empty one would wipe the first and open up the second.
async function readFolderStore(key) {
  const res = await fetch(`${STORE}?key=${encodeURIComponent(key)}`);
  // Refused, not failed: the private records are not this person's to read,
  // and there are none among the folders they are shown.
  if (res.status === 403 && key === PRIVATE_FOLDERS_KEY) return parseFoldersMeta(null);
  if (!res.ok) throw await hubError(res, "Couldn’t load the folders.");
  const { value } = await res.json();
  return parseFoldersMeta(value);
}
/** Both folder maps, apart: what a folder edit is planned against. */
async function getFolderStores() {
  if (!STORE) return { open: parseFoldersMeta(null), locked: parseFoldersMeta(null) };
  const [open, locked] = await Promise.all([
    readFolderStore(OPEN_FOLDERS_KEY),
    // Not asked for by someone the hub would refuse.
    IS_ADULT || IS_ADMIN ? readFolderStore(PRIVATE_FOLDERS_KEY) : parseFoldersMeta(null),
  ]);
  return { open, locked };
}
/** Every folder record this person may read, as one map. */
async function getFoldersMeta() {
  return mergeFolderStores(await getFolderStores());
}
/**
 * Sends planned folder writes (planFolderWrites) in order, each through PATCH
 * /api/store, which serializes read-modify-write inside the usage Durable
 * Object. A whole-map POST read the map, changed it in the browser and wrote
 * it all back, so two adults renaming different folders at the same time
 * silently discarded one of the edits — and the delete path could resurrect a
 * folder another tab had just removed.
 *
 * Falls back to the whole-map write only for folder names that cannot be
 * expressed as a path segment (legacy names containing a dot).
 */
async function sendFolderWrites(writes) {
  if (!STORE) return;
  for (const { key, ops, value } of writes) {
    // The whole path is the folder name: a legacy "taxes.2026" must not pass
    // on the strength of its first segment and be patched in as a nested object.
    const patchable = ops.every((op) => folderPathSafe(op.path));
    const res = await fetch(STORE, {
      method: patchable ? "PATCH" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(patchable ? { key, ops } : { key, value: JSON.stringify(value) }),
    });
    // A rejected patch is reported, not silently downgraded to the racy write.
    if (!res.ok) throw await hubError(res, "Couldn’t save the folder settings.");
  }
}
/** Records `changes` ({ name, entry }, a null entry removing the folder). */
async function saveFolders(stores, changes) {
  await sendFolderWrites(planFolderWrites(stores, changes));
}

// Folders that are not for everyone were once all recorded in the open key.
// The first person who may write moves them out; after that there is nothing
// to move and this is one comparison. A failure is left for the next load:
// nothing is lost by it, and the folders read the same from either key.
async function migrateFolderStores(stores) {
  if (!CAN_WRITE) return stores;
  const writes = planFolderMigration(stores);
  if (writes.length === 0) return stores;
  try {
    await sendFolderWrites(writes);
    return await getFolderStores();
  } catch {
    return stores;
  }
}

// ── Data loading ───────────────────────────────────────────────────────────────
function readFolders() {
  return Promise.all([
    docsGetAll(),
    getFolderStores().then(migrateFolderStores).then(mergeFolderStores),
  ]);
}

async function loadFolders(reads = readFolders()) {
  const [docs, meta] = await reads;
  // Folder list from metadata + any folders that exist only in docs, counted,
  // then narrowed to the ones this person is shown.
  folders = visibleFolders(buildFolderList(docs, meta), {
    isAdult: IS_ADULT, memberId: HUB_MEMBER?.id, groups: hubGroups,
  });
}

// Reads a folder's documents into view. Answers false, changing nothing, when
// a newer read has started or the folder is no longer the open one — a slow
// answer for the folder just left must not land under the next folder's title.
async function loadFiles(folderName) {
  const seq = ++filesLoadSeq;
  const [docs, info] = await Promise.all([docsGetAll({ folder: folderName }), files.list()]);
  if (seq !== filesLoadSeq || currentFolder?.name !== folderName) return false;
  currentFiles = docs;
  storageInfo = info;
  filesLoading = false;
  filesError = null;
  return true;
}

// Re-reads what is on screen after a change. A refresh that fails is said so
// and leaves the last good state in view; it never empties the screen.
async function refresh() {
  try {
    await Promise.all([currentFolder ? loadFiles(currentFolder.name) : null, loadFolders()]);
  } catch (err) {
    if (filesLoading) { filesLoading = false; filesError = failText(err, "Try again."); }
    await hubAlert("Could not refresh the document list.", reasonFor(err));
  }
  renderSidebar();
  renderMain();
}

// Opens `currentFolder`: the previous folder's cards go at once, so nothing of
// it stays clickable under the new title while the new list is on its way.
async function showCurrentFolder() {
  const name = currentFolder?.name;
  currentFiles = [];
  filesError = null;
  filesLoading = !!currentFolder;
  renderSidebar();
  renderMain();
  if (!name) return;
  try {
    if (!await loadFiles(name)) return;
  } catch (err) {
    if (currentFolder?.name !== name) return;
    filesLoading = false;
    filesError = failText(err, "Try again.");
  }
  renderSidebar();
  renderMain();
}

// ── Actions ───────────────────────────────────────────────────────────────────
// Documents in a folder that only someone else (their owner, or an admin) may
// change. A folder rename, re-share or delete that would be refused for some of
// them is not started at all, so it cannot leave the folder half done.
function describeLocked(docs) {
  const locked = docs.filter((d) => !mayChange(d));
  if (locked.length === 0) return null;
  return `${locked.length} ${locked.length === 1 ? "document here was" : "documents here were"} added by someone else: ${locked.map(d => d.title ?? d.id).join(", ")}. Only the person who added a document, or an admin, can change it.`;
}

// Answers true once the folder exists, false when it was turned down with a
// message of its own, and throws when the save itself failed — the New Folder
// form stays open for the last two (see submitNewFolder).
async function createFolder(name, visibility) {
  const folder = name.trim();
  if (!folderPathSafe(folder)) {
    await hubAlert("That folder name can't be used.", {
      description: `Folder names can't contain a dot and must be ${MAX_FOLDER_NAME_LENGTH} characters or fewer.`,
    });
    return false;
  }
  const entry = { visibility, createdBy: HUB_MEMBER?.id ?? "unknown", createdAt: new Date().toISOString() };
  let stores;
  try {
    stores = await getFolderStores();
  } catch (err) {
    await hubAlert("Could not create the folder.", reasonFor(err));
    return false;
  }
  // Writing over an existing name would relabel that folder — a lock on
  // documents still shared with everyone, or the reverse — without touching
  // a single document in it.
  if (folderNameTaken(folder, mergeFolderStores(stores), folders)) {
    await hubAlert("A folder with that name already exists.", { description: "Choose another name, or open the existing folder." });
    return false;
  }
  await saveFolders(stores, [{ name: folder, entry }]);
  try {
    await loadFolders();
  } catch (err) {
    await hubAlert("The folder was created, but the list could not be refreshed.", reasonFor(err));
    return true;
  }
  selectFolder(folder);
  return true;
}

async function deleteFolder(name) {
  if (!await hubConfirm({ message: "Delete this folder?", description: "All documents inside will be permanently removed.", confirmLabel: "Delete folder", destructive: true })) return;
  let docs;
  try {
    docs = await docsGetAll({ folder: name });
  } catch (err) {
    // Not "no documents": removing the folder entry now would hide whatever
    // is in it without deleting anything.
    await hubAlert("Could not read the folder, so nothing was deleted.", reasonFor(err));
    return;
  }
  const locked = describeLocked(docs);
  if (locked) {
    await hubAlert("This folder can't be deleted by you.", { description: `${locked} Nothing was deleted.` });
    return;
  }
  // Deleting the record cascades to its stored file server-side, so a failed
  // request can no longer leave the bytes behind (they stay downloadable by id
  // and charged against the household's quota).
  const results = await Promise.all(docs.map(async (d) => ({ doc: d, ...(await docsDelete(d.id)) })));
  const failed = results.filter(r => !r.ok).map(r => r.doc);
  if (failed.length > 0) {
    // The folder entry stays: dropping it while documents remain would hide
    // them from the sidebar without deleting them, and their bytes keep
    // counting against the household's quota with nothing left pointing at them.
    // "Try again" only when no delete was turned away.
    const refused = results.some(r => !r.ok && r.refused);
    await hubAlert(`${failed.length} ${failed.length === 1 ? "document" : "documents"} could not be deleted.`, {
      description: `The folder was left in place so nothing is orphaned: ${failed.map(d => d.title ?? d.id).join(", ")}. ${refused ? "Some files couldn’t be deleted — check the folder." : "Try again."}`,
    });
    await refresh();
    return;
  }
  try {
    await saveFolders(await getFolderStores(), [{ name, entry: null }]);
  } catch (err) {
    await hubAlert("The documents were deleted, but the folder could not be removed.", failureFor(err, { action: "remove the folder", thing: "folder" }));
  }
  if (currentFolder?.name === name) { currentFolder = null; currentFiles = []; filesLoading = false; filesError = null; }
  await refresh();
}

// The upload of a file whose document's answer was lost: { folder, file,
// uploaded }. Picking the same file for the same folder again reuses it.
let pendingUpload = null;

async function uploadFile(file) {
  if (!currentFolder || !CAN_WRITE) return;
  // One upload at a time, and the flag is taken before anything is awaited: a
  // second upload started meanwhile would share the progress view, and the
  // first to finish would clear it while the other was still sending.
  if (uploading) {
    hubAlert("Another upload is still in progress.", { description: "Wait for it to finish, then try again." });
    return;
  }
  uploading = true;
  // Where the file goes is decided now. `currentFolder` follows the sidebar,
  // and a click on another folder mid-upload must not re-file the document
  // there — under that folder's visibility.
  const folder = { name: currentFolder.name, visibility: currentFolder.visibility };
  renderMain();

  // The stored file's id until a document names it. If anything fails in
  // between, the bytes are removed again: nothing in this app lists a file
  // without a document, so they would only count against the quota. Not when
  // the document's answer was lost: it may be stored and name the file.
  let unfiledId = null;
  let creating = false;   // the failure, if any, is the document's own
  // An earlier try at this same file and folder whose document's answer was
  // lost: its upload is reused, and the document it may have made is looked
  // for before another is created for the same file. Another file or folder:
  // that upload may be named by a stored document, so it is left alone, only
  // no longer reused.
  const pending = pendingUpload && pendingUpload.folder === folder.name && sameFile(pendingUpload.file, file)
    ? pendingUpload : null;
  pendingUpload = pending;
  let result = null;
  try {
    let pct = 0;
    // A picture is stored with a small copy of itself, which the grid shows
    // in place of the original. It belongs to the file: it is deleted with it
    // and opens for the same people, so nothing here has to keep track of it.
    result = pending?.uploaded ?? await files.upload(file, {
      thumbnail: true,
      onProgress: (e) => {
        if (e.lengthComputable) {
          pct = Math.round((e.loaded / e.total) * 100);
          const bar = document.getElementById("upload-progress-bar");
          if (bar) bar.style.width = `${pct}%`;
          const label = document.getElementById("upload-progress-label");
          if (label) label.textContent = `Uploading ${file.name}… ${pct}%`;
        }
      },
    });
    if (!pending) unfiledId = result.id;

    // Landed on the earlier try: done, with no second document for the file.
    // A read that fails throws, and the upload stays pending.
    if (pending && docForFile(await docsGetAll({ folder: folder.name }), result.id)) {
      pendingUpload = null;
    } else {
      // Register document in hub documents table. The folder's visibility maps
      // directly to the platform's sharedWith vocabulary: "everyone", "adults",
      // or a group id — all enforced server-side at read time. It is read again
      // here, not taken from this tab's copy: another adult may have made the
      // folder adults-only since this tab loaded it.
      const visibility = resolveVisibility(await getFoldersMeta(), folder);
      if (visibility === null) {
        throw Object.assign(new Error(`"${folder.name}" was changed or removed by someone else, so the file was not added. Reopen the folder and try again.`), { forUser: true });
      }
      const sharedWith = [visibility];
      // The hub says what it stored, which is not always what was picked: a
      // HEIC photo is kept as a JPEG, under another name, type and size.
      creating = true;
      await docsCreate({
        title: result.name ?? file.name,
        category: "other",
        fileKey: result.id,
        mimeType: result.mimeType ?? file.type,
        sizeBytes: result.sizeBytes ?? file.size,
        sharedWith,
        folder: folder.name,
      });
      unfiledId = null;
      pendingUpload = null;
    }
  } catch (err) {
    // The document's answer was lost: it may be stored. Read the folder back
    // and look for a document naming this file. Found: it landed, and there is
    // nothing to say. Not found, or the read failed: the file is kept for the
    // next try at the same file, and is never deleted, since a stored document
    // may name it.
    let landed = false;
    if (creating && outcomeUnknown(err)) {
      try { landed = !!docForFile(await docsGetAll({ folder: folder.name }), result.id); }
      catch (readErr) { console.error(readErr); }
      unfiledId = null;
      pendingUpload = landed ? null : { folder: folder.name, file, uploaded: result };
    } else if (creating && pending) {
      // Refused, after the read above found no document naming the reused
      // file: nothing refers to it.
      unfiledId = result.id;
      pendingUpload = null;
    }
    if (unfiledId) await files.delete(unfiledId).catch(() => {});
    if (!landed) {
      // An upload or a document the hub refused (too large, wrong type, not
      // allowed, storage full) says why in this app's words; never the hub's.
      if (!err?.forUser) console.error(err);
      hubAlert(uploadFailureLine(err, { action: "upload the file", thing: "file" }));
    } else {
      console.error(err);
    }
  } finally {
    uploading = false;
  }
  // Reload files and folder counts
  await refresh();
}

async function deleteDocument(doc) {
  if (!await hubConfirm({ message: `Delete "${doc.title}"?`, confirmLabel: "Delete", destructive: true })) return;

  // Optimistic: remove from local state and render immediately
  currentFiles = currentFiles.filter(d => d.id !== doc.id);
  const folder = folders.find(f => f.name === currentFolder?.name);
  if (folder) folder.doc_count = Math.max(0, (folder.doc_count ?? 1) - 1);
  renderSidebar();
  renderMain();

  // Deleting the record cascades to its stored file server-side; the client no
  // longer races a best-effort file delete whose failure nobody observed.
  const result = await docsDelete(doc.id);
  // The re-read below puts the document back when the hub refused; say so,
  // or it simply reappears.
  if (!result.ok) await hubAlert(`"${doc.title}" could not be deleted.`, { description: result.error });
  await refresh();
}

function selectFolder(name) {
  currentFolder = folders.find(f => f.name === name) ?? null;
  return showCurrentFolder();
}

// ── Render sidebar ─────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById("folder-list");
  if (folders.length === 0) {
    list.innerHTML = `<div style="padding:16px;color:var(--muted);font-size:.8rem">No folders yet</div>`;
  } else {
    list.innerHTML = folderListHtml(folders, { currentName: currentFolder?.name, groups: hubGroups, esc, glyph });
  }

  // Storage bar
  if (storageInfo.limit > 0) {
    const bar = document.getElementById("storage-bar");
    bar.style.display = "block";
    document.getElementById("storage-text").textContent =
      `${formatBytes(storageInfo.totalBytes)} / ${formatBytes(storageInfo.limit)}`;
    document.getElementById("storage-fill").style.width =
      `${Math.min(100, (storageInfo.totalBytes / storageInfo.limit) * 100).toFixed(1)}%`;
  }
}

// ── Render main area ───────────────────────────────────────────────────────────
function renderMain() {
  const title   = document.getElementById("folder-title");
  const actions = document.getElementById("header-actions");
  const grid    = document.getElementById("files-grid");

  if (!currentFolder) {
    title.textContent = "Family Documents";
    actions.innerHTML = "";
    grid.innerHTML = `<div class="empty"><div class="empty-icon">${chickadee("nest", { size: 72 })}</div><p>Select a folder to view documents</p></div>`;
    return;
  }

  const _folderGroup = hubGroups.find(g => g.id === currentFolder.visibility);
  const lockBadge = currentFolder.visibility === "adults"
    ? `<span style="font-size:.72rem;padding:2px 8px;border-radius:20px;background:var(--amber-light);color:var(--amber);font-weight:700;margin-left:8px">Adults only ${glyph("lock")}</span>`
    : _folderGroup
    ? `<span style="font-size:.72rem;padding:2px 8px;border-radius:20px;background:var(--amber-light);color:var(--amber);font-weight:700;margin-left:8px">${glyph("people")} ${esc(_folderGroup.name)}</span>`
    // Shared with a group that is gone: only each document's owner (and an
    // admin) can still read it, until the folder is given a new visibility.
    : visibilityKind(currentFolder.visibility, hubGroups) === "missing"
    ? `<span style="font-size:.72rem;padding:2px 8px;border-radius:20px;background:var(--amber-light);color:var(--amber);font-weight:700;margin-left:8px" title="Its documents can only be seen by whoever added them. Use Rename to choose who sees this folder.">Group removed ${glyph("lock")}</span>`
    : "";
  title.innerHTML = esc(currentFolder.name) + lockBadge;

  actions.innerHTML = `
    <input type="search" placeholder="Search files…" value="${esc(docSearch)}" oninput="setDocSearch(this.value)"
      style="border:1.5px solid var(--border-mid);border-radius:8px;padding:5px 10px;font-size:0.82rem;font-family:inherit;background:var(--card);color:var(--text);width:150px" />
    ${CAN_WRITE ? `<button class="btn btn-ghost btn-sm" onclick="openRenameFolder()">Rename</button>` : ""}
    ${CAN_WRITE ? `<button class="btn btn-ghost btn-sm" style="color:var(--red);border-color:var(--red)" onclick="deleteFolderCurrent()">Delete folder</button>` : ""}
    ${CAN_WRITE ? `<button class="btn btn-primary btn-sm" onclick="triggerUpload()" ${uploading ? "disabled" : ""}>↑ Upload</button>` : ""}
  `;

  if (uploading) {
    grid.innerHTML = `
      <div class="upload-progress">
        <div id="upload-progress-label" style="font-size:.85rem;color:var(--muted)">Uploading…</div>
        <div class="progress-bar-wrap"><div class="progress-bar" id="upload-progress-bar" style="width:0%"></div></div>
      </div>`;
    return;
  }

  const dropZone = CAN_WRITE ? `
    <div class="drop-zone" id="drop-zone"
      ondragover="event.preventDefault();this.classList.add('drag-over')"
      ondragleave="this.classList.remove('drag-over')"
      ondrop="handleDrop(event)">
      <div class="drop-icon">${glyph("paperclip")}</div>
      <strong>Drop files here</strong> or <a href="#" onclick="event.preventDefault();triggerUpload()" style="color:var(--accent)">browse</a>
      <div style="margin-top:6px;font-size:.75rem;color:var(--muted)">
        PDF, images, Word, Excel, text · max ${formatBytes(window.__RESOURCE_LIMITS?.max_file_bytes ?? 10485760)}
      </div>
    </div>` : "";

  if (filesLoading) {
    grid.innerHTML = `<div class="empty" style="padding:20px">Loading…</div>`;
    return;
  }

  // A folder that could not be read is not shown as an empty one.
  if (filesError) {
    grid.innerHTML = `<div class="empty">
      <p style="margin-bottom:12px">This folder could not be loaded. ${esc(filesError)}</p>
      <button class="btn btn-ghost btn-sm" data-action="retry-folder">Try again</button>
    </div>`;
    return;
  }

  const filtered = docSearch ? currentFiles.filter(d => searchMatch(docSearch, searchableFields(d))) : currentFiles;

  if (currentFiles.length === 0) {
    grid.innerHTML = dropZone;
    return;
  }

  if (filtered.length === 0) {
    grid.innerHTML = dropZone + `<div class="empty" style="padding:20px">No files match your search.</div>`;
    return;
  }

  // Ids and file keys travel in data attributes and are read back by the
  // grid's one click listener — nothing a document carries is written into script.
  const canMove = folders.length > 1;
  const cards = filtered.map(doc => {
    const own = mayChange(doc);
    return `
      <div class="file-card" data-doc-id="${esc(doc.id)}">
        ${own ? `<button class="file-rename" data-doc-action="rename" title="Rename" aria-label="Rename">${glyph("pencil")}</button>` : ""}
        ${own ? `<button class="file-del" data-doc-action="delete" title="Delete" aria-label="Delete">${glyph("close", { accent: "currentColor" })}</button>` : ""}
        ${own && canMove ? `<button class="file-move" data-doc-action="move" title="Move to folder">Move</button>` : ""}
        <div class="file-thumb">${isPreviewableImage(doc.mimeType) && doc.fileKey ? `<img src="${esc(files.url(doc.thumbnailKey ?? doc.fileKey))}" loading="lazy" />` : `<span>${glyph(fileGlyph(doc.mimeType))}</span>`}</div>
        <div class="file-name" title="${esc(doc.title)}">${esc(doc.title)}</div>
        <div class="file-meta">${formatBytes(doc.sizeBytes ?? 0)} · ${formatRelativeDate(doc.createdAt)}</div>
      </div>`;
  }).join("");

  grid.innerHTML = dropZone + cards;
}

// ── Window actions ─────────────────────────────────────────────────────────────
// One listener each for the folder list and the file grid. Their rows are
// rebuilt on every render, and what a row stands for is read from its data
// attributes rather than baked into an inline handler.
document.getElementById("folder-list").addEventListener("click", (e) => {
  const item = e.target.closest("[data-folder]");
  if (item) selectFolder(item.dataset.folder);
});

document.getElementById("files-grid").addEventListener("click", (e) => {
  if (e.target.closest('[data-testid="load-retry"]')) { init(); return; }
  if (e.target.closest("[data-action='retry-folder']")) { showCurrentFolder(); return; }
  const card = e.target.closest("[data-doc-id]");
  if (!card) return;
  const id = card.dataset.docId;
  const action = e.target.closest("[data-doc-action]")?.dataset.docAction;
  if (action === "rename") window.renameDoc(id);
  else if (action === "delete") window.deleteDoc(id);
  else if (action === "move") window.moveDoc(id);
  else window.previewDoc(id);
});

window.setDocSearch = function(v) {
  docSearch = v;
  renderMain();
  // renderMain rebuilds the header, search box included; typing carries on in
  // the new one.
  const box = document.querySelector("#header-actions input[type=search]");
  if (box) { box.focus(); box.setSelectionRange(v.length, v.length); }
};

window.renameDoc = async function(id) {
  const doc = currentFiles.find(d => d.id === id);
  if (!doc) return;
  const el = document.createElement("div");
  el.className = "modal-backdrop";
  el.innerHTML = `
    <div class="modal">
      <h3>Rename File</h3>
      <div class="form-group">
        <label>Name</label>
        <input id="rename-doc-input" type="text" value="${esc(doc.title)}" />
      </div>
      <div id="rename-doc-err" style="display:none" class="error-msg" role="alert"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
        <button class="btn btn-primary" id="rename-doc-save-btn">Save</button>
      </div>
    </div>`;
  el.addEventListener("click", e => { if (e.target === el) el.remove(); });
  document.body.appendChild(el);
  const input = document.getElementById("rename-doc-input");
  input?.focus(); input?.select();
  input?.addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("rename-doc-save-btn")?.click();
    if (e.key === "Escape") el.remove();
  });
  document.getElementById("rename-doc-save-btn").addEventListener("click", async () => {
    const name = document.getElementById("rename-doc-input")?.value?.trim();
    if (!name) return;
    const btn = document.getElementById("rename-doc-save-btn");
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = "Saving…";

    // The form stays open until the hub has the new name: a refused rename
    // says so here and leaves what was typed in place to send again.
    const result = await docsPatch(id, { title: name }, { action: "rename the file", thing: "file" });
    btn.disabled = false; btn.textContent = "Save";
    if (!result.ok) {
      const err = document.getElementById("rename-doc-err");
      err.textContent = result.error;
      err.style.display = "block";
      return;
    }
    const localDoc = currentFiles.find(d => d.id === id);
    if (localDoc) localDoc.title = name;
    el.remove();
    renderMain();
    await refresh();
  });
};

window.moveDoc = async function(id) {
  const doc = currentFiles.find(d => d.id === id);
  if (!doc) return;
  const otherFolders = folders.filter(f => f.name !== currentFolder?.name);
  if (otherFolders.length === 0) {
    hubAlert("No other folders to move to. Create another folder first.");
    return;
  }
  const el = document.createElement("div");
  el.className = "modal-backdrop";
  el.innerHTML = `
    <div class="modal">
      <h3>Move File</h3>
      <div class="form-group">
        <label>Move "${esc(doc.title)}" to</label>
        <select id="move-folder-select">
          ${otherFolders.map(f => `<option value="${esc(f.name)}">${esc(f.name)}</option>`).join("")}
        </select>
      </div>
      <div id="move-doc-err" style="display:none" class="error-msg" role="alert"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
        <button class="btn btn-primary" id="move-doc-save-btn">Move</button>
      </div>
    </div>`;
  el.addEventListener("click", e => { if (e.target === el) el.remove(); });
  document.body.appendChild(el);
  document.getElementById("move-doc-save-btn").addEventListener("click", async () => {
    const targetName = document.getElementById("move-folder-select")?.value;
    if (!targetName) return;
    const btn = document.getElementById("move-doc-save-btn");
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = "Moving…";
    const dstFolder = folders.find(f => f.name === targetName);

    // Carry the target folder's visibility onto the doc so access tracks the
    // destination — as the destination is NOW, read again rather than taken
    // from this tab's copy, which another adult may have changed since.
    let result;
    try {
      const visibility = resolveVisibility(await getFoldersMeta(), dstFolder ?? { name: targetName, visibility: null });
      result = visibility === null
        ? { ok: false, error: `"${doc.title}" could not be moved: "${targetName}" was changed or removed by someone else. Reopen it and try again.` }
        : await docsPatch(id, { folder: targetName, sharedWith: [visibility] }, { action: "move the file", thing: "file" });
    } catch (err) {
      console.error(err);
      result = { ok: false, error: failureLine(err, { action: "move the file", thing: "file" }) };
    }
    btn.disabled = false; btn.textContent = "Move";
    // A refused move says so in the form, which stays open on the chosen folder.
    if (!result.ok) {
      const err = document.getElementById("move-doc-err");
      err.textContent = result.error;
      err.style.display = "block";
      return;
    }
    el.remove();
    await refresh();
  });
};

window.deleteFolderCurrent = () => currentFolder && deleteFolder(currentFolder.name);

window.deleteDoc = (id) => {
  const doc = currentFiles.find(d => d.id === id);
  if (doc) deleteDocument(doc);
};

window.triggerUpload = () => {
  const input = document.getElementById("file-input");
  input.accept = accept();
  input.click();
};

window.handleDrop = async (e) => {
  e.preventDefault();
  document.getElementById("drop-zone")?.classList.remove("drag-over");
  const f = e.dataTransfer.files[0];
  if (f) await uploadFile(f);
};

window.previewDoc = (id) => {
  const doc = currentFiles.find(d => d.id === id);
  if (doc) openPreview(doc);
};

// ── PDF.js renderer ────────────────────────────────────────────────────────────
const PDFJS_VERSION = "4.9.155";
const PDFJS_CDN     = `https://unpkg.com/pdfjs-dist@${PDFJS_VERSION}/build`;

let _pdfjsLib = null;
async function getPdfjs() {
  if (_pdfjsLib) return _pdfjsLib;
  const { getDocument, GlobalWorkerOptions } = await import(`${PDFJS_CDN}/pdf.min.mjs`);
  GlobalWorkerOptions.workerSrc = `${PDFJS_CDN}/pdf.worker.min.mjs`;
  _pdfjsLib = { getDocument };
  return _pdfjsLib;
}

async function renderPdf(blobUrl, container) {
  container.style.cssText = "overflow-y:auto;background:#525659;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;height:70vh";
  container.innerHTML = `<p style="color:#ccc;font-size:.85rem">Loading PDF…</p>`;

  try {
    const { getDocument } = await getPdfjs();
    const pdf = await getDocument(blobUrl).promise;
    container.innerHTML = "";

    // Create all canvases upfront to preserve DOM order, then render all pages in parallel
    const entries = Array.from({ length: pdf.numPages }, (_, i) => {
      const canvas = document.createElement("canvas");
      canvas.style.cssText = "display:block;box-shadow:0 2px 8px rgba(0,0,0,.4);max-width:100%";
      const label = document.createElement("p");
      label.textContent = `Page ${i + 1} of ${pdf.numPages}`;
      label.style.cssText = "color:#aaa;font-size:.72rem;text-align:center;margin-top:-4px";
      container.appendChild(canvas);
      container.appendChild(label);
      return { canvas, pageNum: i + 1 };
    });

    await Promise.all(entries.map(async ({ canvas, pageNum }) => {
      const page     = await pdf.getPage(pageNum);
      const vp       = page.getViewport({ scale: 1 });
      const scale    = Math.min(1.5, (container.clientWidth - 32) / vp.width);
      const viewport = page.getViewport({ scale });
      canvas.width   = viewport.width;
      canvas.height  = viewport.height;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    }));
  } catch (err) {
    console.error(err);
    container.innerHTML = `<p style="color:#fca5a5;padding:20px">Couldn’t show this PDF.</p>`;
  }
}

// ── Fetch file as blob URL (bypasses ad blockers, works for both preview and download) ──
async function fetchBlobUrl(fileKey) {
  const res = await fetch(files.url(fileKey));
  const blob = await res.blob();
  return { blobUrl: URL.createObjectURL(blob), mimeType: blob.type };
}

// ── Download ───────────────────────────────────────────────────────────────────
async function downloadDoc(fileKey, filename) {
  const { blobUrl } = await fetchBlobUrl(fileKey);
  const a = document.createElement("a");
  a.href = blobUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
}

// ── Preview ────────────────────────────────────────────────────────────────────
async function openPreview(doc) {
  // Show modal immediately with a loading state, then swap in content
  const el = document.createElement("div");
  el.className = "modal-backdrop";
  el.innerHTML = `
    <div class="modal preview-modal">
      <div class="preview-header">
        <h3>${esc(doc.title)}</h3>
        <button id="preview-dl-btn" class="btn btn-ghost btn-sm" title="Download">↓ Download</button>
        <button class="btn-icon" aria-label="Close" onclick="this.closest('.modal-backdrop').remove()">${glyph("close")}</button>
      </div>
      <div class="preview-body" id="preview-body-inner">
        <div class="no-preview"><p style="color:#94a3b8">Loading…</p></div>
      </div>
    </div>`;
  el.addEventListener("click", e => { if (e.target === el) el.remove(); });
  document.body.appendChild(el);

  const bodyEl = el.querySelector("#preview-body-inner");
  const dlBtn  = el.querySelector("#preview-dl-btn");

  let blobUrl;
  try {
    ({ blobUrl } = await fetchBlobUrl(doc.fileKey));
  } catch {
    bodyEl.innerHTML = `<div class="no-preview"><p style="color:#94a3b8">Failed to load file</p></div>`;
    return;
  }

  // Revoke blob URL when modal closes
  el.addEventListener("remove", () => URL.revokeObjectURL(blobUrl));
  const origRemove = el.remove.bind(el);
  el.remove = () => { URL.revokeObjectURL(blobUrl); origRemove(); };

  dlBtn.onclick = () => {
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = doc.title;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  if (isPreviewableImage(doc.mimeType)) {
    bodyEl.innerHTML = `<img src="${blobUrl}" alt="${esc(doc.title)}" />`;
  } else if (isPdf(doc.mimeType)) {
    await renderPdf(blobUrl, bodyEl);
  } else {
    bodyEl.innerHTML = `<div class="no-preview">
      <div style="font-size:3rem;margin-bottom:12px">${glyph(fileGlyph(doc.mimeType))}</div>
      <p>No preview available</p>
    </div>`;
  }
}

window.downloadDoc = downloadDoc;

// ── New folder modal ───────────────────────────────────────────────────────────
window.openNewFolder = function() {
  if (!CAN_WRITE) { hubAlert(IS_ROSTER ? "Only the space steward can create folders." : "Only adults can create folders."); return; }
  const el = document.createElement("div");
  el.className = "modal-backdrop";
  el.innerHTML = `
    <div class="modal">
      <h3>New Folder</h3>
      <div class="form-group">
        <label>Folder name</label>
        <input id="new-folder-name" type="text" placeholder="e.g. Medical Records" data-autofocus />
      </div>
      <div class="form-group">
        <label>Visible to</label>
        <select id="new-folder-vis">
          <option value="everyone">Everyone</option>
          <option value="adults">Adults only</option>
          ${hubGroups.map(g => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join("")}
        </select>
      </div>
      <div id="new-folder-err" style="display:none" class="error-msg" role="alert"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="submitNewFolder()">Create</button>
      </div>
    </div>`;
  el.addEventListener("click", e => { if (e.target === el) el.remove(); });
  document.body.appendChild(el);
  // Programmatic focus works inside cross-origin iframes (unlike the autofocus
  // attribute, which the browser blocks) because it rides the user's click gesture.
  el.querySelector("[data-autofocus]")?.focus();
};

window.submitNewFolder = async function() {
  const name = document.getElementById("new-folder-name")?.value?.trim();
  const vis  = document.getElementById("new-folder-vis")?.value ?? "everyone";
  const err  = document.getElementById("new-folder-err");
  if (!name) { err.textContent = "Please enter a name."; err.style.display = "block"; return; }
  // The form stays open until the folder exists: a refused save leaves the
  // name in place to send again.
  const modal = err.closest(".modal-backdrop");
  const btn = modal?.querySelector(".modal-actions .btn-primary");
  if (btn?.disabled) return;
  if (btn) { btn.disabled = true; btn.textContent = "Creating…"; }
  err.style.display = "none";
  let created = false;
  try {
    created = await createFolder(name, vis);
  } catch (e) {
    console.error(e);
    err.textContent = failureLine(e, { action: "create the folder", thing: "folder" });
    err.style.display = "block";
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Create"; }
  }
  if (created) modal?.remove();
};

// ── Rename folder modal ────────────────────────────────────────────────────────
window.openRenameFolder = function() {
  if (!currentFolder || !CAN_WRITE) return;
  const f = currentFolder;
  const el = document.createElement("div");
  el.className = "modal-backdrop";
  el.innerHTML = `
    <div class="modal">
      <h3>Rename Folder</h3>
      <div class="form-group">
        <label>Name</label>
        <input id="rename-input" type="text" value="${esc(f.name)}" />
      </div>
      <div class="form-group">
        <label>Visible to</label>
        <select id="rename-vis">
          <option value="everyone" ${f.visibility === "everyone" ? "selected" : ""}>Everyone</option>
          <option value="adults"   ${f.visibility === "adults"   ? "selected" : ""}>Adults only</option>
          ${hubGroups.map(g => `<option value="${esc(g.id)}" ${f.visibility === g.id ? "selected" : ""}>${esc(g.name)}</option>`).join("")}
          ${/* Without its own option the select would fall to "Everyone", and
               saving a mere rename would share the whole folder with everyone. */
            visibilityKind(f.visibility, hubGroups) === "missing" ? `<option value="${esc(f.visibility)}" selected>A group that was removed</option>` : ""}
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="submitRename()">Save</button>
      </div>
    </div>`;
  el.addEventListener("click", e => { if (e.target === el) el.remove(); });
  document.body.appendChild(el);
  setTimeout(() => { const i = document.getElementById("rename-input"); i?.focus(); i?.select(); }, 50);
};

window.submitRename = async function() {
  const name = document.getElementById("rename-input")?.value?.trim();
  const vis  = document.getElementById("rename-vis")?.value ?? "everyone";
  if (!name || !currentFolder) return;
  const folder = currentFolder;
  const btn = document.querySelector('.modal-actions .btn-primary');
  const restoreButton = () => { if (btn) { btn.disabled = false; btn.textContent = "Save"; } };
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const nameChanged = name !== folder.name;
  const visChanged  = vis  !== folder.visibility;
  if (nameChanged && !folderPathSafe(name)) {
    restoreButton();
    await hubAlert("That folder name can't be used.", {
      description: `Folder names can't contain a dot and must be ${MAX_FOLDER_NAME_LENGTH} characters or fewer.`,
    });
    return;
  }
  // Both reads must succeed before anything is written. A read that failed
  // is not an empty folder: taking it for one would record "adults only"
  // having re-shared no document at all.
  let stores, meta, docs = [];
  try {
    stores = await getFolderStores();
    meta = mergeFolderStores(stores);
    if (nameChanged || visChanged) docs = await docsGetAll({ folder: folder.name });
  } catch (err) {
    restoreButton();
    await hubAlert("Could not read the folder, so nothing was changed.", reasonFor(err));
    return;
  }
  // Renaming onto an existing folder would pour these documents into it and
  // put this folder's visibility label on documents that never had it.
  if (nameChanged && folderNameTaken(name, meta, folders)) {
    restoreButton();
    await hubAlert("A folder with that name already exists.", { description: "Choose another name. To combine folders, move the files across instead." });
    return;
  }
  const locked = describeLocked(docs);
  if (locked) {
    restoreButton();
    await hubAlert("This folder can't be changed by you.", { description: `${locked} Nothing was changed.` });
    return;
  }
  // Re-sync the folder's docs when the name and/or visibility changes. A
  // visibility change must rewrite each doc's sharedWith so server-side access
  // tracks the folder (e.g. switching "everyone" → "adults"); a name change
  // moves them to the new folder name.
  //
  // The folder's own metadata is written ONLY once every document PATCH has
  // succeeded. Previously the responses were never inspected, so a partial
  // failure still recorded "adults only" — and the sidebar rendered the 🔒
  // badge from that intent while the documents it describes were still shared
  // with everyone. The badge now only ever reflects what the server accepted.
  if (docs.length > 0) {
    const patch = {};
    if (nameChanged) patch.folder = name;
    if (visChanged)  patch.sharedWith = [vis];
    const results = await Promise.all(docs.map(async (d) => ({ doc: d, ...(await docsPatch(d.id, patch)) })));
    const failed = results.filter(r => !r.ok).map(r => r.doc);
    // "Try again" / "Save again" only when no change was turned away.
    const refused = results.some(r => !r.ok && r.refused);
    if (failed.length > 0) {
      // The documents that did change are put back as they were read, so the
      // folder is not left split across two names or two audiences. What the
      // person is told depends on whether that worked.
      const undone = await Promise.all(results.filter(r => r.ok).map(
        r => docsPatch(r.doc.id, { folder: r.doc.folder, sharedWith: r.doc.sharedWith ?? [] }),
      ));
      const titles = failed.map(d => d.title ?? d.id).join(", ");
      restoreButton();
      await hubAlert(`${failed.length} ${failed.length === 1 ? "document" : "documents"} could not be updated.`, {
        description: undone.every(r => r.ok)
          ? `The folder was left as it was, so nothing claims a protection it doesn't have: ${titles}. ${refused ? "Some files couldn’t be changed — check the folder." : "Try again."}`
          : `Some documents were updated and others were not (${titles}), and the change could not be undone. ${refused ? "Check the folder." : "Save again to finish it."}`,
      });
      await refresh();
      return;
    }
  }
  const previous = folderEntry(meta, folder.name) ?? {};
  const entry = { ...previous, visibility: vis, createdBy: previous.createdBy ?? HUB_MEMBER?.id ?? "unknown" };
  const changes = [{ name, entry }];
  if (nameChanged) changes.push({ name: folder.name, entry: null });
  try {
    await saveFolders(stores, changes);
  } catch (err) {
    restoreButton();
    await hubAlert("Could not save folder settings.", failureFor(err, { action: "save the folder settings", thing: "folder" }));
    return;
  }
  document.querySelector(".modal-backdrop")?.remove();
  if (currentFolder === folder) currentFolder = { ...folder, name, visibility: vis };
  await refresh();
};

document.getElementById("file-input").addEventListener("change", async (e) => {
  const f = e.target.files?.[0];
  e.target.value = "";

// ── Deep link ──────────────────────────────────────────────────────────────────
async function handleDeepLink() {
  const fileId = new URLSearchParams(window.location.search).get("fileId");
  if (!fileId) return;
  // Asked for by id: the list is paged, and a linked document is as likely to
  // be an old one as one of the newest.
  const res = await fetch(`${DOCS}/${encodeURIComponent(fileId)}`).catch(() => null);
  if (!res?.ok) return;
  const doc = await res.json().catch(() => null);
  if (!doc || typeof doc !== "object") return;
  if (doc.folder) {
    currentFolder = folders.find(f => f.name === doc.folder) ?? { name: doc.folder, visibility: "everyone" };
    await showCurrentFolder();
  }
  openPreview(doc);
}

// ── Init ───────────────────────────────────────────────────────────────────────
// True from a failed first load until a load succeeds. While it is, no folder
// list is shown and no folder can be made.
let loadFailed = false;
async function init() {
  const list = document.getElementById("folder-list");
  if (!DOCS) {
    list.innerHTML =
      `<div style="padding:16px;color:var(--red);font-size:.8rem">Documents not available</div>`;
    return;
  }
  // Read-only members (everyone but the steward in a roster) never see the
  // "new folder" control — writes would be rejected by the hub anyway.
  document.getElementById("new-folder-btn").style.display = CAN_WRITE ? "" : "none";
  list.innerHTML = `<div style="padding:16px;color:var(--muted);font-size:.8rem">Loading…</div>`;
  // The folder reads start now and are only awaited below, after the groups
  // are in: loadFolders filters by group membership, so it must not finish
  // first, but it has no reason to start second.
  const folderReads = readFolders();
  folderReads.catch(() => {});
  try {
    const [info] = await Promise.all([
      files.list(),
      CONTEXT
        // Groups that could not be read fail the load: an empty list would
        // call every group folder's group "removed".
        ? fetch(`${CONTEXT}?keys=family.groups`).then(r => r.ok ? r.json() : Promise.reject(new Error("Could not load the groups")))
            .then(d => { if (!d || typeof d !== "object" || d.error || (Array.isArray(d.$errors) && d.$errors.includes("family.groups"))) throw new Error("Could not load the groups"); hubGroups = d["family.groups"] ?? []; })
        : Promise.resolve(),
    ]);
    storageInfo = info;
    await loadFolders(folderReads);
  } catch (err) {
    // A first load that fails says so and offers another go, rather than
    // sitting on "Loading…" for good.
    loadFailed = true;
    list.innerHTML = "";
    document.getElementById("new-folder-btn").style.display = "none";
    document.getElementById("files-grid").innerHTML = `<div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the folders.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
    return;
  }
  if (loadFailed) { loadFailed = false; renderMain(); }
  renderSidebar();
  handleDeepLink();
}
init();
